name: DPSE v2 Enterprise Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  enterprise-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Enterprise Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          brew install vale gitleaks

      - name: Security Audit (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Architectural Boundary Verification (Import-Linter)
        run: |
          lint-imports

      - name: Python Modernization & Formatting Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Strict Static Type Check (Mypy)
        run: |
          mypy src/

      - name: Data Contract Schema Validation (DataContract CLI)
        run: |
          datacontract test datacontract.yaml

      - name: SQL Dialect Linting (SQLFluff)
        run: |
          sqlfluff lint models/ --dialect postgres

      - name: Prose Quality Check (Vale)
        run: |
          vale README.md

      - name: Containerized Integration Tests (Testcontainers & Pytest)
        run: |
          pytest --cov=src tests/

      - name: Execution Memory Leak Audit (Memray)
        run: |
          pytest --memray --memray-limit-mb=512 tests/
