[project]
name = "coverdrive"
version = "0.1.0"
description = "Cricket performance data platform — ingestion, lakehouse, dbt warehouse, and serving API."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nadeem Theba" }]
license = { text = "MIT" }

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "boto3>=1.34",
    "duckdb>=0.10",
    "pyspark==3.5.1",
    "pandera[pandas]>=0.18",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyYAML>=6.0",
    "import-linter>=2.0",
    "datacontract-cli>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "moto[s3]>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "astronomer-cosmos[dbt-duckdb]>=1.4",
    "sqlfluff>=3.0.0",
    "pytest-memray>=1.6.0",
    "testcontainers[postgres,kafka]>=3.7.0",
]
dbt = ["dbt-core>=1.7", "dbt-duckdb>=1.7"]

[project.scripts]
coverdrive-ingest = "coverdrive.extract.espn_html_extractor:main"
coverdrive-transform = "coverdrive.transform.schema_conform:main"
coverdrive-quality = "coverdrive.contracts.pandera_gates:main"
coverdrive-api = "coverdrive.api:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "PT",       # pytest
]
ignore = ["S101", "N806", "S105", "E501", "B008", "B905", "S311", "E712", "F841", "C901", "B007", "PT011", "S608", "ANN101", "ANN102", "T201", "S310", "S104", "N818", "N805", "B017", "SIM102", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"airflow/**" = ["ANN201"]
"scripts/**" = ["E501", "S", "ANN", "F841", "RUF", "E741", "S603", "S607"]
"src/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
disable_error_code = ["misc", "attr-defined", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "s3fs.*", "boto3.*", "botocore.*", "fastapi.*", "pydantic_settings.*", "coverdrive.*", "pandera.*", "testcontainers.*", "memray.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Strict Data Engineering Layer Isolation"
type = "layers"
layers = [
    "load",
    "quality",
    "transform",
    "ingest",
    "utils"
]
containers = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: requires docker-compose services running",
    "slow: runs over 5 seconds",
]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "raw"
max_line_length = 100
